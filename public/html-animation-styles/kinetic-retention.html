<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetic Retention Style</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #ffe000;
        color: #000000;
        font-family: Impact, "Arial Black", Inter, Arial, sans-serif;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        padding: 6vh 6vw 23vh;
      }
      .burst {
        position: absolute;
        inset: -10vh -6vw 18vh;
        background:
          radial-gradient(circle at 20% 28%, #ffffff 0 4%, transparent 4.2%),
          radial-gradient(circle at 80% 20%, #ff3b30 0 5%, transparent 5.2%),
          repeating-conic-gradient(from 8deg at 50% 48%, rgba(0,0,0,0.13) 0 8deg, transparent 8deg 18deg);
        animation: pulse 1.3s ease-in-out infinite alternate;
      }
      .layout {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 4vw;
        height: 100%;
        align-items: center;
      }
      .label {
        display: inline-block;
        padding: 10px 18px;
        border: 4px solid #000;
        border-radius: 999px;
        background: #fff;
        font-family: Inter, Arial, sans-serif;
        font-size: clamp(18px, 1.8vw, 30px);
        font-weight: 1000;
        text-transform: uppercase;
        transform: rotate(-4deg);
        animation: pop 520ms cubic-bezier(0.2, 1.55, 0.35, 1) forwards;
      }
      h1 {
        margin: 2vh 0 0;
        font-size: clamp(72px, 10vw, 164px);
        font-weight: 1000;
        line-height: 0.78;
        letter-spacing: 0;
        text-transform: uppercase;
        text-shadow: 10px 10px 0 rgba(0,0,0,0.16);
      }
      h1 span {
        display: block;
        transform-origin: left center;
        opacity: 0;
        animation: wordIn 620ms cubic-bezier(0.2, 1.55, 0.35, 1) calc(var(--i) * 140ms) forwards;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .card {
        border: 5px solid #000;
        border-radius: 22px;
        padding: 18px 20px;
        background: #ffffff;
        box-shadow: 12px 12px 0 #000;
        transform: translateX(40px) rotate(var(--r));
        opacity: 0;
        animation: cardIn 620ms cubic-bezier(0.2, 1.45, 0.35, 1) calc(350ms + var(--i) * 120ms) forwards;
      }
      .card strong {
        display: block;
        font-size: clamp(28px, 3.4vw, 54px);
        line-height: 0.9;
      }
      .card span {
        display: block;
        margin-top: 8px;
        font-family: Inter, Arial, sans-serif;
        font-size: clamp(13px, 1.3vw, 20px);
        font-weight: 950;
        text-transform: uppercase;
      }
      .progress {
        margin-top: 4vh;
        height: 24px;
        border: 4px solid #000;
        border-radius: 999px;
        background: #fff;
        overflow: hidden;
      }
      .progress span {
        display: block;
        width: 76%;
        height: 100%;
        background: #ff3b30;
        animation: fill 1.1s ease-out forwards;
      }
      .safe {
        position: absolute;
        left: 6vw;
        right: 6vw;
        bottom: 9vh;
        height: 1px;
        background: rgba(0,0,0,0.18);
      }
      @keyframes pop { from { transform: scale(0.4) rotate(-18deg); opacity: 0; } }
      @keyframes wordIn { from { transform: scale(0.25) rotate(-14deg); opacity: 0; } to { transform: scale(1) rotate(var(--rot)); opacity: 1; } }
      @keyframes cardIn { to { transform: translateX(0) rotate(var(--r)); opacity: 1; } }
      @keyframes fill { from { width: 0; } }
      @keyframes pulse { to { transform: scale(1.035) rotate(0.6deg); } }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="kinetic retention animation preview">
      <div class="burst"></div>
      <section class="layout">
        <div>
          <div class="label">watch this first</div>
          <h1>
            <span style="--i: 0; --rot: -3deg">STOP</span>
            <span style="--i: 1; --rot: 2deg">SCROLLING</span>
            <span style="--i: 2; --rot: -1deg">NOW</span>
          </h1>
          <div class="progress"><span></span></div>
        </div>
        <div class="stack">
          <div class="card" style="--i: 0; --r: 3deg"><strong>01</strong><span>hook in 2 seconds</span></div>
          <div class="card" style="--i: 1; --r: -2deg"><strong>3x</strong><span>visual contrast</span></div>
          <div class="card" style="--i: 2; --r: 2deg"><strong>KEEP</strong><span>motion always moving</span></div>
        </div>
      </section>
      <div class="safe"></div>
    </main>
  </body>
</html>
