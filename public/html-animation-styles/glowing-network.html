<!DOCTYPE html><html><head><style>body{margin:0;height:100vh;background:#111;display:flex;justify-content:center;align-items:center;font-family:monospace;} .net{display:flex;align-items:center;gap:4vw;} .node{width:8vw;height:8vw;background:#222;border:3px solid #ff00ff;border-radius:50%;display:flex;justify-content:center;align-items:center;color:#fff;font-size:2vw;opacity:0;animation:revealNode 1s forwards, breathe 2s infinite alternate;} .line{width:8vw;height:3px;background:#333;position:relative;opacity:0;animation:revealNode 1s forwards;} .line::after{content:"";position:absolute;top:0;left:0;height:100%;width:0%;background:#00ffff;box-shadow:0 0 10px #00ffff;animation:flowLight 2s infinite;} .seq-1{animation-delay:0s, 0s;} .seq-2{animation-delay:1s;} .seq-3{animation-delay:2s, 0s;} @keyframes revealNode {to{opacity:1;transform:scale(1);}} @keyframes breathe {to{box-shadow:0 0 30px #ff00ff;background:rgba(255,0,255,0.2);}} @keyframes flowLight {to{width:100%;}}</style></head><body><div class="net"><div class="node seq-1">A</div><div class="line seq-2"></div><div class="node seq-3">B</div></div></body></html>
