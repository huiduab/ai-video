<!DOCTYPE html><html><head><style>body{margin:0;height:100vh;background:#0d1117;display:flex;justify-content:center;align-items:center;font-family:sans-serif;color:#fff;} .container{display:flex;align-items:center;gap:3vw;} .box{background:#161b22;border:2px solid #3fb950;padding:2vw 4vw;border-radius:12px;box-shadow:0 0 15px rgba(63,185,80,0.2);opacity:0; animation:fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;} .box h2{margin:0;font-size:3vw;color:#58a6ff;} .arrow{width:10vw;height:4px;background:repeating-linear-gradient(90deg, #8b949e 0, #8b949e 10px, transparent 10px, transparent 20px);background-size:20px 100%;opacity:0;animation:fadeIn 1s forwards, flowAnim 1s linear infinite;} .delay-1{animation-delay: 0.5s, 0.5s;} .delay-2{animation-delay: 1.5s, 1.5s;} .delay-3{animation-delay: 2.5s;} @keyframes fadeIn {to {opacity:1;}} @keyframes flowAnim {to {background-position:-20px 0;}}</style></head><body><div class="container"><div class="box delay-1"><h2>INPUT</h2></div><div class="arrow delay-2"></div><div class="box delay-3"><h2>PROCESS</h2></div></div></body></html>
