<!DOCTYPE html><html><head><style>body{margin:0;height:100vh;background:#050505;display:flex;justify-content:center;align-items:center;perspective:1200px;font-family:sans-serif;} .scene{transform-style:preserve-3d;animation:rotateScene 15s ease-in-out infinite alternate;} .layer{width:40vw;height:20vh;background:rgba(0,255,255,0.05);border:2px solid rgba(0,255,255,0.5);border-radius:16px;display:flex;justify-content:center;align-items:center;font-size:3vw;color:#0ff;text-shadow:0 0 10px #0ff;position:absolute;box-shadow:0 0 20px rgba(0,255,255,0.1) inset;} .l1{transform:translateZ(100px);opacity:0;animation:popIn 1s cubic-bezier(0,0.8,0.2,1) forwards 0s;} .l2{transform:translateZ(0px);opacity:0;animation:popIn 1s cubic-bezier(0,0.8,0.2,1) forwards 0.5s;} .l3{transform:translateZ(-100px);opacity:0;animation:popIn 1s cubic-bezier(0,0.8,0.2,1) forwards 1s;} @keyframes rotateScene {from{transform:rotateY(-15deg) rotateX(10deg)}to{transform:rotateY(15deg) rotateX(10deg)}} @keyframes popIn {to{opacity:1;}}</style></head><body><div class="scene"><div class="layer l1">Layer 1</div><div class="layer l2">Layer 2</div><div class="layer l3">Layer 3</div></div></body></html>
